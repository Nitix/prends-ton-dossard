name: CI

# Go and the web checks run on every push; the browser tests of Vitest run on
# five targets: Chromium, Firefox and WebKit on a computer, and WebKit as an
# iPhone 15 and Chromium as a Pixel 7. The phones are emulated by Playwright
# (viewport, touch, user agent): they are not real devices.
on: push

permissions:
  contents: read

# A new push to a branch cancels the run of the same branch that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest 1.27: go.mod says 1.27.0, which has the vulnerabilities of the standard
      # library that govulncheck finds and 1.27.2 fixes. go.mod stays the minimum of the module.
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      # Lists the files that need formatting, then fails if there are any.
      - name: gofmt
        run: test -z "$(gofmt -l server tools | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      # server/webdist/dist/.gitkeep is committed: it lets the program, which
      # embeds the front end, compile without building the front end first.
      - name: go test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web-checks:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version of pnpm comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir web typecheck
      - name: Lint
        run: pnpm --dir web lint
      - name: Format check
        run: pnpm --dir web fmt:check
      # src/skins/lookFailure.test.ts starts Chromium itself, so the unit tests need it. The
      # other browsers are in web-browser, with the browser tests.
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      # The unit tests (Node) only: the browser tests are in web-browser. The JSON report is
      # read by the next step when they fail: the logs of a run need a sign-in to be read.
      - name: Unit tests
        run: pnpm --dir web exec vitest run --project unit --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/vitest-unit.json
      - name: Failing unit tests, as annotations
        if: failure()
        run: node tools/ci/vitest-annotate.mjs "${{ runner.temp }}/vitest-unit.json" "Tests unitaires en échec"
      - name: Build
        run: pnpm --dir web build

  web-browser:
    name: Navigateur — ${{ matrix.name }}${{ matrix.experimental && ' (en cours)' || '' }}
    runs-on: ubuntu-latest
    # The targets with experimental: true run and annotate, and do
    # not make the run red (docs/TODO.md). None is, now: all seven jobs block.
    # Compared with true: a target without the key would give an empty value, which GitHub
    # refuses, and then no browser job runs at all.
    continue-on-error: ${{ matrix.experimental == true }}
    # A hung browser would otherwise run for six hours.
    # Every target takes 1 to 9 minutes (the iPhone 8 to 9): 30 leaves room for the run again on a
    # cold cache, and a hung browser does not hold a runner for an hour.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome
            browser: chromium
            device: ""
            experimental: false
          - name: Firefox
            browser: firefox
            device: ""
            experimental: false
          - name: Safari
            browser: webkit
            device: ""
            experimental: false
          - name: Safari (iPhone 15)
            browser: webkit
            device: iPhone 15
            experimental: false
          - name: Chrome (Pixel 7)
            browser: chromium
            device: Pixel 7
            experimental: false
    env:
      VITEST_BROWSER: ${{ matrix.browser }}
      VITEST_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      # The dependencies that Vite pre-bundles for the browser tests, kept between runs, keyed on the
      # lockfile and the config (which lists what is pre-bundled). A cold cache made a run
      # re-optimise during the tests: a failed import on Firefox, a page not ready on the iPhone
      # (runs 24 and before). The key does not change from run to run, so the second run finds it.
      # It is saved by its own step, after the tests and whatever they did: actions/cache saves only
      # when the job succeeds, and a target that was red never saved anything (run 25: Firefox and
      # Safari). The first run after a change of key is still cold: the files that did not import
      # are run again (see the tests step).
      - name: Cache of Vite
        id: vite-cache
        uses: actions/cache/restore@v5
        with:
          path: web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'web/vite.config.ts') }}
          restore-keys: vite-${{ runner.os }}-
      - name: Say what the cache of Vite found
        run: echo "cache-hit=${{ steps.vite-cache.outputs.cache-hit }} matched-key=${{ steps.vite-cache.outputs.cache-matched-key }}"
      # Only the browser of the target. No cache: the downloads are small next to the run, and
      # a cache would need an action that this file does not use yet.
      - name: Install the browser
        run: pnpm --dir web exec playwright install --with-deps ${{ matrix.browser }}
      # The reports (JSON, and the annotations of Vitest) are written by the first run. CI=true (set
      # by GitHub) gives every target but desktop Chromium 2 retries per test, and 5 s per action
      # (web/vite.config.ts): a test that needed a retry is a warning in the next step, so it is
      # seen, not hidden. Desktop Chromium has no retry.
      # A first run on a cold cache of Vite can fail on files it re-optimises (the README says to
      # run again before believing a failure). Then only the files that did not import (a failed
      # file with no test result, tools/ci/cold-cache.mjs) are run again, whatever else failed in
      # the first run, and the two reports are merged: a test that really failed stays failed. The
      # report of the first run is kept, so its flaky warnings are not lost.
      - name: Browser tests
        shell: bash
        run: |
          set -o pipefail
          temp="${{ runner.temp }}"
          run() {
            out="$1"; log="$2"; shift 2
            pnpm --dir web exec vitest run --project browser --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$out" "$@" 2>&1 | tee -a "$log"
          }
          if ! run "$temp/vitest-browser.json" "$temp/vitest-browser.log"; then
            if files=$(node tools/ci/cold-cache.mjs files "$temp/vitest-browser.json" "$temp/vitest-browser.log"); then
              echo "A cold cache of Vite: run again $(echo "$files" | grep -c . || true) file(s) that did not import (none listed: the whole suite)."
              mv "$temp/vitest-browser.json" "$temp/vitest-browser-first.json"
              second=0
              # shellcheck disable=SC2086
              run "$temp/vitest-browser-second.json" "$temp/vitest-browser.log" $files || second=$?
              node tools/ci/cold-cache.mjs merge "$temp/vitest-browser-first.json" "$temp/vitest-browser-second.json" "$temp/vitest-browser.json"
              [ "$second" -eq 0 ]
            else
              exit 1
            fi
          fi
      # After the tests, whatever they did: the cache is saved from a red target too.
      - name: Save the cache of Vite
        if: ${{ always() && steps.vite-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'web/vite.config.ts') }}
      - name: Failing and flaky tests, as annotations
        if: always()
        shell: bash
        run: |
          first="${{ runner.temp }}/vitest-browser-first.json"
          if [ -f "$first" ]; then
            node tools/ci/vitest-annotate.mjs --flaky-only "$first" "Tests en échec — ${{ matrix.name }} (1er passage)"
          fi
          node tools/ci/vitest-annotate.mjs "${{ runner.temp }}/vitest-browser.json" "Tests en échec — ${{ matrix.name }}" "${{ runner.temp }}/vitest-browser.log"
