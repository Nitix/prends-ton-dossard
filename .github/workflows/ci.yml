name: CI

# Go and the web checks run on every push; the browser tests of Vitest run on
# five targets: Chromium, Firefox and WebKit on a computer, and WebKit as an
# iPhone 15 and Chromium as a Pixel 7. The phones are emulated by Playwright
# (viewport, touch, user agent): they are not real devices.
on: push

permissions:
  contents: read

# A new push to a branch cancels the run of the same branch that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest 1.27: go.mod says 1.27.0, which has the vulnerabilities of the standard
      # library that govulncheck finds and 1.27.2 fixes. go.mod stays the minimum of the module.
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          check-latest: true
      # Lists the files that need formatting, then fails if there are any.
      - name: gofmt
        run: test -z "$(gofmt -l server tools | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      # server/webdist/dist/.gitkeep is committed: it lets the program, which
      # embeds the front end, compile without building the front end first.
      - name: go test
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web-checks:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version of pnpm comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir web typecheck
      - name: Lint
        run: pnpm --dir web lint
      - name: Format check
        run: pnpm --dir web fmt:check
      # src/skins/lookFailure.test.ts starts Chromium itself, so the unit tests need it. The
      # other browsers are in web-browser, with the browser tests.
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      # The unit tests (Node) only: the browser tests are in web-browser. The JSON report is
      # read by the next step when they fail: the logs of a run need a sign-in to be read.
      - name: Unit tests
        run: pnpm --dir web exec vitest run --project unit --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/vitest-unit.json
      - name: Failing unit tests, as annotations
        if: failure()
        run: node tools/ci/vitest-annotate.mjs "${{ runner.temp }}/vitest-unit.json" "Tests unitaires en échec"
      - name: Build
        run: pnpm --dir web build

  web-browser:
    name: Navigateur — ${{ matrix.name }}${{ matrix.experimental && ' (en cours)' || '' }}
    runs-on: ubuntu-latest
    # Firefox, Safari and the iPhone have failing tests that are not looked at yet (docs/TODO.md):
    # they run and annotate, and do not make the run red.
    # Compared with true: a target without the key would give an empty value, which GitHub
    # refuses, and then no browser job runs at all.
    continue-on-error: ${{ matrix.experimental == true }}
    # A hung browser would otherwise run for six hours.
    # The emulated iPhone is the slowest target (WebKit, a phone, retries): it gets an hour, so it
    # ends on its own result instead of a cancel, which would mark the whole run « cancelled ».
    timeout-minutes: ${{ matrix.device == 'iPhone 15' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome
            browser: chromium
            device: ""
            experimental: false
          - name: Firefox
            browser: firefox
            device: ""
            experimental: false
          - name: Safari
            browser: webkit
            device: ""
            experimental: true
          - name: Safari (iPhone 15)
            browser: webkit
            device: iPhone 15
            experimental: true
          - name: Chrome (Pixel 7)
            browser: chromium
            device: Pixel 7
            experimental: true
    env:
      VITEST_BROWSER: ${{ matrix.browser }}
      VITEST_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      # Only the browser of the target. No cache: the downloads are small next to the run, and
      # a cache would need an action that this file does not use yet.
      - name: Install the browser
        run: pnpm --dir web exec playwright install --with-deps ${{ matrix.browser }}
      # A first run on a cold cache of Vite can fail on files it re-optimises (the README says to
      # run again before believing a failure): the run is made again, with the reports, only then.
      # CI=true (set by GitHub) gives every target 2 retries per test, and the targets other than
      # desktop Chromium longer actions (web/vite.config.ts).
      - name: Browser tests
        run: >-
          pnpm --dir web exec vitest run --project browser ||
          pnpm --dir web exec vitest run --project browser --reporter=default --reporter=github-actions --reporter=json --outputFile.json=${{ runner.temp }}/vitest-browser.json
      - name: Failing tests, as annotations
        if: failure()
        run: node tools/ci/vitest-annotate.mjs "${{ runner.temp }}/vitest-browser.json" "Tests en échec — ${{ matrix.name }}"
