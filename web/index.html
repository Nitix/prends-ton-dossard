<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prends ton dossard</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The header is the violet sky of the dawn in both themes: so is the bar of the browser. -->
    <meta name="theme-color" content="#5e4ae3" />
    <meta name="color-scheme" content="light dark" />
    <!-- A theme chosen in the settings (lib/theme.ts), on <html> before the page is drawn:
         no flash of the other one. Auto is left to the phone, through the stylesheet.
         Then the skin chosen (skins/index.ts), from the table of the skins and their
         modes that the build writes in place of the empty one (skins/plugin.ts): a skin
         with one mode only is drawn in it, whatever the theme. -->
    <script>
      try {
        const theme = localStorage.getItem("ptd-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
        const skins = /* skins */ {};
        const skin = localStorage.getItem("ptd-skin");
        if (skin !== null && Object.hasOwn(skins, skin)) {
          document.documentElement.dataset.skin = skin;
          if (skins[skin].length === 1) {
            document.documentElement.dataset.theme = skins[skin][0];
            document.documentElement.style.colorScheme = skins[skin][0];
          }
        }
      } catch (error) {}
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prends ton dossard" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
